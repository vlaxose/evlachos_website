# evlachos_website — automated maintenance
# Install with:  sudo cp scripts/cron.conf /etc/cron.d/evlachos_website
#
# Weekly (Monday 08:00): Scholar new papers + citation milestones → publish
0 8 * * 1  vagos  cd /home/vagos/www/evlachos_website && scripts/venv/bin/python3 scripts/scholar_news.py >> logs/scholar.log 2>&1 && scripts/publish.sh >> logs/publish.log 2>&1

# Monthly (1st, 07:00): refresh IEEE download/citation stats → publish
0 7 1 * *  vagos  cd /home/vagos/www/evlachos_website && scripts/venv/bin/python3 scripts/fetch_ieee_stats.py >> logs/ieee.log 2>&1 && scripts/publish.sh >> logs/publish.log 2>&1
