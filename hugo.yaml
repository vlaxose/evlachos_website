# --- General Settings ---
baseURL: "https://evlachos.space/"
title: Dr. Evangelos Vlachos
defaultContentLanguage: en
enableGitInfo: false

# --- ⚠️ CRITICAL: The Theme Engine ---
# Without this, the site will be blank
module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5

# --- Appearance (High Density / Fritz!Box Style) ---
params:
  appearance:
    theme: classic
    font: minimal
    font_size: M
    mode: light      # Force light mode

  features:
    math:
      enable: true

  marketing:
    seo:
      description: 'Tenure-track Researcher at ISI, Athena RC, working on Integrated Sensing and Communications (ISAC), UAV swarm coordination, and 6G networks. 47+ publications, 1,100+ citations.'

  # Clean Footer
  footer:
    show_powered_by: false
    blox_attribution: false
    copyright:
      notice: '© 2026 Dr. Evangelos Vlachos'
      license:
        enable: false

# --- Rendering & Security ---
markup:
  goldmark:
    renderer:
      unsafe: true

security:
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'
      - '^WC_'

# --- Languages ---
languages:
  en:
    languageName: English
    weight: 1
    menu:
      main:
        - name: News
          url: '#news'
          weight: 10
        - name: Publications
          url: '#publications'
          weight: 20
        - name: Projects
          url: '/projects/'
          weight: 30
        - name: Contact
          url: '#contact'
          weight: 50
  el:
    languageName: Ελληνικά
    weight: 2
    title: Δρ. Ευάγγελος Βλάχος
    menu:
      main:
        - name: Νέα
          url: '#news'
          weight: 10
        - name: Δημοσιεύσεις
          url: '#publications'
          weight: 20
        - name: Έργα
          url: '/projects/'
          weight: 30
        - name: Επικοινωνία
          url: '#contact'
          weight: 50
