server:
  headers:
    - for: '/**'
      values:
        Cache-Control: no-store

# --- General Settings ---
baseURL: "https://evlachos.space/"
title: Dr. Evangelos Vlachos
defaultContentLanguage: en
enableGitInfo: false

# --- ⚠️ CRITICAL: The Theme Engine ---
# Without this, the site will be blank
module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5

# --- Appearance (High Density / Fritz!Box Style) ---
params:
  header:
    navbar:
      align: r

  appearance:
    theme: classic
    font: minimal
    font_size: M
    mode: light      # Force light mode

  features:
    math:
      enable: true

  marketing:
    seo:
      description: 'Tenure-track Researcher at ISI, Athena RC, working on Integrated Sensing and Communications (ISAC), UAV swarm coordination, and 6G networks. 47+ publications, 1,100+ citations.'

  # Clean Footer
  footer:
    show_powered_by: false
    blox_attribution: false
    copyright:
      notice: '© 2026 Dr. Evangelos Vlachos'
      license:
        enable: false

# --- Rendering & Security ---
markup:
  goldmark:
    renderer:
      unsafe: true

security:
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'
      - '^WC_'

# --- Languages ---
languages:
  en:
    languageName: English
    weight: 1
    menu:
      main:
        - name: Home
          url: '/'
          weight: 5
        - name: News
          url: '/post/'
          weight: 10
        - name: Publications
          url: '/publication/'
          weight: 20
        - name: Projects
          url: '/projects/'
          weight: 30
        - name: Teaching
          url: '/teaching/'
          weight: 40
        - name: Contact
          url: '/contact/'
          weight: 50
  el:
    languageName: Ελληνικά
    weight: 2
    title: Δρ. Ευάγγελος Βλάχος
    menu:
      main:
        - name: Αρχική
          url: '/'
          weight: 5
        - name: Νέα
          url: '/post/'
          weight: 10
        - name: Δημοσιεύσεις
          url: '/publication/'
          weight: 20
        - name: Έργα
          url: '/projects/'
          weight: 30
        - name: Διδασκαλία
          url: '/teaching/'
          weight: 40
        - name: Επικοινωνία
          url: '/contact/'
          weight: 50
