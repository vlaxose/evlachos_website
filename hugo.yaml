# --- General Settings ---
baseURL: "https://evlachos.space/"
title: Dr. Evangelos Vlachos
defaultContentLanguage: en
enableGitInfo: false

# --- ⚠️ CRITICAL: The Theme Engine ---
# Without this, the site will be blank
module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5

# --- Appearance (High Density / Fritz!Box Style) ---
params:
  appearance:
    theme: classic
    font: minimal
    font_size: S      # Small font for technical dashboard look
    mode: navy       # Force light mode

  features:
    math:
      enable: true

  # Clean Footer
  footer:
    show_powered_by: false
    blox_attribution: false
    copyright:
      notice: '© 2026 Dr. Evangelos Vlachos'
      license:
        enable: false

# --- Rendering & Security ---
markup:
  goldmark:
    renderer:
      unsafe: true

security:
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'
      - '^WC_'

# --- Menus ---
languages:
  en:
    menu:
      main:
        - name: Home
          url: '#about'
          weight: 10
        - name: Experience
          url: '#experience'
          weight: 20
        - name: Projects
          url: '/projects/'
          weight: 30
        - name: Publications
          url: '#featured'
          weight: 40
