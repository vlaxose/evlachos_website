# --- General Settings ---
baseURL: "https://evlachos.space/"
title: Dr. Evangelos Vlachos
defaultContentLanguage: en
enableGitInfo: false

# --- ⚠️ CRITICAL: The Theme Engine ---
# Without this, the site will be blank
module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5

# --- Appearance (High Density / Fritz!Box Style) ---
params:
  appearance:
    theme: classic
    font: minimal
    font_size: S      # Small font for technical dashboard look
    mode: light      # Force light mode

  features:
    math:
      enable: true

  # Clean Footer
  footer:
    show_powered_by: false
    blox_attribution: false
    copyright:
      notice: '© 2026 Dr. Evangelos Vlachos'
      license:
        enable: false

# --- Rendering & Security ---
markup:
  goldmark:
    renderer:
      unsafe: true

security:
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'
      - '^WC_'

# --- Languages ---
languages:
  en:
    languageName: English
    weight: 1
    menu:
      main:
        - name: Publications
          url: '#publications'
          weight: 10
        - name: Projects
          url: '/projects/'
          weight: 20
        - name: News
          url: '#news'
          weight: 30
        - name: Bio
          url: '#about'
          weight: 40
  el:
    languageName: Ελληνικά
    weight: 2
    title: Δρ. Ευάγγελος Βλάχος
    menu:
      main:
        - name: Δημοσιεύσεις
          url: '#publications'
          weight: 10
        - name: Έργα
          url: '/projects/'
          weight: 20
        - name: Νέα
          url: '#news'
          weight: 30
        - name: Βιογραφικό
          url: '#about'
          weight: 40
