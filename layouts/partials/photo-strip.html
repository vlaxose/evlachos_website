{{/* Row of photos with equal heights; photos = list of {src, alt, caption} under assets/ */}}
{{ with .photos }}
<div class="photo-strip">
  {{ range . }}{{ $meta := . }}{{ with resources.Get .src }}
  {{ $sm := .Resize "x280 webp q80" }}{{ $lg := .Resize "x560 webp q80" }}
  <figure class="photo-strip-item" style="flex: {{ div (float $lg.Width) $lg.Height }} 1 0">
    <img src="{{ $lg.RelPermalink }}" srcset="{{ $sm.RelPermalink }} {{ $sm.Width }}w, {{ $lg.RelPermalink }} {{ $lg.Width }}w"
         sizes="(max-width: 576px) 70vw, 33vw" width="{{ $lg.Width }}" height="{{ $lg.Height }}"
         alt="{{ $meta.alt }}" loading="{{ if $.eager }}eager{{ else }}lazy{{ end }}" decoding="async">
    {{ with $meta.caption }}<figcaption>{{ . }}</figcaption>{{ end }}
  </figure>
  {{ end }}{{ end }}
</div>
{{ end }}
